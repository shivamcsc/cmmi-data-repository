<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img"
           aria-label="Context diagram: uploaders and the Nextcloud share send workbooks into the CMMI Data Repository; vertical head, admin and CTO approve or turn them down; analysts take approved rows out as CSV.">
  <title>Context diagram</title>
  <style>
    .bx   { fill:#ffffff; stroke:#0d1b3e; stroke-width:1.5 }
    .ent  { fill:#eef1f6; stroke:#0d1b3e; stroke-width:1.5 }
    .proc { fill:#ffffff; stroke:#2563eb; stroke-width:2 }
    .store-line { stroke:#0d1b3e; stroke-width:1.5 }
    .store-fill { fill:#eef1f6 }
    .flow { stroke:#11162a; stroke-width:1.4; fill:none }
    .flow-dash { stroke:#a12020; stroke-width:1.4; fill:none; stroke-dasharray:5 4 }
    .t      { font-family:'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif; font-size:13px;   font-weight:600; fill:#11162a }
    .t-sm   { font-family:'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif; font-size:11.5px; font-weight:500; fill:#11162a }
    .lbl    { font-family:'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif; font-size:11px;   font-weight:500; fill:#616b80 }
    .num    { font-family:'IBM Plex Mono',Menlo,Consolas,'Courier New',monospace; font-size:11px;   font-weight:600; fill:#2563eb }
    .code   { font-family:'IBM Plex Mono',Menlo,Consolas,'Courier New',monospace; font-size:11.5px; fill:#11162a }
    .code-mut { font-family:'IBM Plex Mono',Menlo,Consolas,'Courier New',monospace; font-size:10.5px; fill:#616b80 }
    .card   { font-family:'IBM Plex Mono',Menlo,Consolas,'Courier New',monospace; font-size:11px;   font-weight:600; fill:#616b80 }
</style>
  <rect width="960" height="350" fill="#ffffff"/>
        <defs>
          <marker id="ar-01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
          </marker>
        </defs>

        <!-- central process -->
        <rect class="proc" x="380" y="90" width="200" height="170" rx="12"/>
        <text class="num" x="480" y="152" text-anchor="middle">0</text>
        <text class="t" x="480" y="176" text-anchor="middle">CMMI Data</text>
        <text class="t" x="480" y="194" text-anchor="middle">Repository</text>
        <text class="code-mut" x="480" y="215" text-anchor="middle">FastAPI + MySQL</text>

        <!-- entities -->
        <rect class="ent" x="40" y="118" width="170" height="56" rx="4"/>
        <text class="t-sm" x="125" y="142" text-anchor="middle">Uploader</text>
        <text class="lbl" x="125" y="159" text-anchor="middle">CMMI team</text>

        <rect class="ent" x="40" y="226" width="170" height="56" rx="4"/>
        <text class="t-sm" x="125" y="250" text-anchor="middle">Nextcloud share</text>
        <text class="lbl" x="125" y="267" text-anchor="middle">project folders</text>

        <rect class="ent" x="750" y="87" width="170" height="56" rx="4"/>
        <text class="t-sm" x="835" y="111" text-anchor="middle">Vertical Head</text>
        <text class="lbl" x="835" y="128" text-anchor="middle">Admin &middot; CTO</text>

        <rect class="ent" x="750" y="226" width="170" height="56" rx="4"/>
        <text class="t-sm" x="835" y="250" text-anchor="middle">Analyst</text>
        <text class="lbl" x="835" y="267" text-anchor="middle">MQAS / modelling</text>

        <!-- flows -->
        <line class="flow" x1="212" y1="146" x2="374" y2="146" marker-end="url(#ar-01)"/>
        <text class="lbl" x="293" y="138" text-anchor="middle">workbook + project + period</text>

        <line class="flow" x1="212" y1="254" x2="374" y2="254" marker-end="url(#ar-01)"/>
        <text class="lbl" x="293" y="246" text-anchor="middle">folder tree &mdash; bulk import</text>

        <line class="flow" x1="582" y1="104" x2="744" y2="104" marker-end="url(#ar-01)"/>
        <text class="lbl" x="663" y="96" text-anchor="middle">sheets awaiting sign-off</text>

        <line class="flow" x1="744" y1="128" x2="586" y2="128" marker-end="url(#ar-01)"/>
        <text class="lbl" x="665" y="146" text-anchor="middle">approve / turn down + note</text>

        <line class="flow" x1="582" y1="254" x2="744" y2="254" marker-end="url(#ar-01)"/>
        <text class="lbl" x="663" y="246" text-anchor="middle">approved rows &middot; CSV</text>
      </svg>
